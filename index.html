<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スキー場3Dビューア</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div id="info" hidden></div>

  <!-- フライト中だけ表示する視点コントローラー (ボタンは押している間ずっと効く) -->
  <div id="flight-hud" role="toolbar" aria-label="フライト中の視点操作">
    <div class="hud-group">
      <span class="hud-label">左右</span>
      <button id="hud-left" aria-label="左へ回り込む">◀</button>
      <button id="hud-right" aria-label="右へ回り込む">▶</button>
    </div>
    <div class="hud-group">
      <span class="hud-label">上下</span>
      <button id="hud-up" aria-label="高く">▲</button>
      <button id="hud-down" aria-label="低く">▼</button>
    </div>
    <div class="hud-group">
      <span class="hud-label">遠近</span>
      <button id="hud-near" aria-label="近づく">＋</button>
      <button id="hud-far" aria-label="離れる">－</button>
    </div>
    <div class="hud-group">
      <span class="hud-label">視線</span>
      <button id="hud-look-up" aria-label="遠くの景色を見る">⤴</button>
      <button id="hud-look-down" aria-label="足元を見る">⤵</button>
    </div>
    <div class="hud-group">
      <button id="hud-pause" class="wide">⏸ 一時停止</button>
      <button id="hud-reset" class="wide">↺ 戻す</button>
      <button id="hud-stop" class="wide">■ 終了</button>
    </div>
  </div>

  <aside id="panel">
    <header>
      <h1>スキー場3Dビューア</h1>
      <button id="toggle-panel" aria-label="パネルを折りたたむ">▾</button>
    </header>
    <div id="panel-body">
      <section>
        <h2>エリア</h2>
        <div id="resorts"></div>
      </section>

      <section id="areas-section" hidden>
        <h2>スキー場で絞り込み <small>地図上の名前をクリックしても選べます</small></h2>
        <div id="areas" class="chips"></div>
      </section>

      <section>
        <h2>季節</h2>
        <div class="row">
          <button data-season="winter">❄ 冬</button>
          <button data-season="summer">☀ 夏</button>
        </div>
        <label class="row check"><input id="snow-toggle" type="checkbox"> 雪を降らせる</label>
      </section>

      <section>
        <h2>視点 <small>右ドラッグ・2本指でも回せます</small></h2>
        <div class="seg" role="group" aria-label="見る方角">
          <button data-from="n">北から</button>
          <button data-from="e">東から</button>
          <button data-from="s">南から</button>
          <button data-from="w">西から</button>
        </div>
        <div class="seg" role="group" aria-label="見る角度">
          <button data-pitch="top">真上</button>
          <button data-pitch="oblique">斜め</button>
          <button data-pitch="low">低空</button>
        </div>
        <div class="seg" role="group" aria-label="回転・傾き(押している間)">
          <button id="rot-left" aria-label="左に回す">↺ 左</button>
          <button id="rot-right" aria-label="右に回す">右 ↻</button>
          <button id="tilt-up" aria-label="上から見る">⤒ 上へ</button>
          <button id="tilt-down" aria-label="横から見る">⤓ 下へ</button>
        </div>
      </section>

      <section id="tour-controls">
        <h2>フライト</h2>
        <div class="row">
          <button id="orbit">空撮で一周</button>
          <button id="stop" disabled>停止</button>
        </div>
        <div class="seg" role="group" aria-label="フライト中のカメラ">
          <button data-camera="chase" class="active">後ろから</button>
          <button data-camera="pov">一人称</button>
          <button data-camera="side">横から</button>
          <button data-camera="top">上空から</button>
        </div>
        <p class="hint free-look-hint">フライト中: ドラッグで回り込み・上下ドラッグで高さ・Shift+上下ドラッグで視線・ホイール/ピンチで遠近。キーは ←→ 回り込み / ↑↓ 高さ / W・S 遠近 / R・F 視線 / Space 一時停止 <button id="reset-look">視点を戻す</button></p>
        <label class="row">速度
          <input id="speed" type="range" min="0.5" max="4" step="0.5" value="1.5">
          <span id="speed-label">×1.5</span>
        </label>
        <label class="row">起伏の強調
          <input id="exag" type="range" min="1" max="2" step="0.1" value="1.3">
          <span id="exag-label">×1.3</span>
        </label>
      </section>

      <section>
        <h2>リフト <small>クリックで詳細</small></h2>
        <ul id="lifts" class="list"></ul>
      </section>

      <section>
        <h2>コース <small>クリックで詳細</small></h2>
        <div class="legend">
          <span><i style="background:var(--easy)"></i>初級</span>
          <span><i style="background:var(--intermediate)"></i>中級</span>
          <span><i style="background:var(--advanced)"></i>上級</span>
          <span><i style="background:var(--freeride)"></i>非圧雪</span>
        </div>
        <ul id="runs" class="list"></ul>
      </section>
      <p id="status"></p>
    </div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="resorts.js"></script>
  <script src="osm-query.js"></script>
  <script src="app.js"></script>
</body>
</html>
