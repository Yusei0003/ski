<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スキー場3Dビューア</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <header>
      <h1>スキー場3Dビューア</h1>
      <button id="toggle-panel" aria-label="パネルを折りたたむ">▾</button>
    </header>
    <div id="panel-body">
      <section>
        <h2>スキー場</h2>
        <div id="resorts"></div>
      </section>

      <section id="tour-controls">
        <h2>フライト</h2>
        <div class="row">
          <button id="orbit">空撮で一周</button>
          <button id="stop" disabled>停止</button>
        </div>
        <label class="row">速度
          <input id="speed" type="range" min="0.5" max="4" step="0.5" value="1.5">
          <span id="speed-label">×1.5</span>
        </label>
        <label class="row">起伏の強調
          <input id="exag" type="range" min="1" max="2" step="0.1" value="1.3">
          <span id="exag-label">×1.3</span>
        </label>
      </section>

      <section>
        <h2>リフト <small>クリックで乗車</small></h2>
        <ul id="lifts" class="list"></ul>
      </section>

      <section>
        <h2>コース <small>クリックで滑走</small></h2>
        <div class="legend">
          <span><i style="background:var(--easy)"></i>初級</span>
          <span><i style="background:var(--intermediate)"></i>中級</span>
          <span><i style="background:var(--advanced)"></i>上級</span>
          <span><i style="background:var(--freeride)"></i>非圧雪</span>
        </div>
        <ul id="runs" class="list"></ul>
      </section>
      <p id="status"></p>
    </div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="resorts.js"></script>
  <script src="app.js"></script>
</body>
</html>
